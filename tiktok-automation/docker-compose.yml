version: "3.8"

# TikTok content automation stack: n8n (orchestrator) + Postiz (scheduling/posting)
# + MoneyPrinterTurbo (script -> voiceover -> stock footage -> captioned video).
# See README.md for setup order and .env.example for required secrets.

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postiz

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MAIN_URL=${POSTIZ_MAIN_URL:-http://localhost:5000}
      - FRONTEND_URL=${POSTIZ_MAIN_URL:-http://localhost:5000}
      - NEXT_PUBLIC_BACKEND_URL=${POSTIZ_MAIN_URL:-http://localhost:5000}/api
      - JWT_SECRET=${POSTIZ_JWT_SECRET}
      - DATABASE_URL=postgresql://postiz:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz
      - REDIS_URL=redis://postiz-redis:6379
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
    volumes:
      - postiz_config:/config/postiz
      - postiz_uploads:/uploads
    depends_on:
      - postiz-postgres
      - postiz-redis

  postiz-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postiz
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postiz
    volumes:
      - postiz_pg_data:/var/lib/postgresql/data

  postiz-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - postiz_redis_data:/data

  moneyprinter:
    image: ${MONEYPRINTER_IMAGE:-moneyprinterturbo:latest}
    # Build locally: git clone https://github.com/harry0703/MoneyPrinterTurbo and
    # `docker build -t moneyprinterturbo:latest .` before first `docker compose up`.
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    volumes:
      - moneyprinter_storage:/app/storage

volumes:
  n8n_data:
  postiz_config:
  postiz_uploads:
  postiz_pg_data:
  postiz_redis_data:
  moneyprinter_storage:
